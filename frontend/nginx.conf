# Nginx SPA config for production frontend container.
server {
  listen 8080;
  server_name _;

  server_tokens off;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: http: wss: ws:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Content-Type-Options "nosniff" always;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg)$ {
    try_files $uri =404;
    expires 1y;
  }
}
