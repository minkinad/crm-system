<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1440"
  height="900"
  viewBox="0 0 1440 900"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">CRM System sales cockpit</title>
  <desc id="description">
    Dashboard preview with forecast, sales risks, pipeline, next actions, tasks,
    and accounts.
  </desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="10"
        flood-color="#0f172a"
        flood-opacity="0.08"
      />
    </filter>
    <style>
      .ui {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .title {
        fill: #0f172a;
        font-size: 22px;
        font-weight: 700;
      }
      .section {
        fill: #0f172a;
        font-size: 18px;
        font-weight: 700;
      }
      .metric {
        fill: #0f172a;
        font-size: 30px;
        font-weight: 750;
      }
      .body {
        fill: #334155;
        font-size: 14px;
      }
      .muted {
        fill: #64748b;
        font-size: 12px;
      }
      .label {
        fill: #475569;
        font-size: 13px;
        font-weight: 600;
      }
      .small {
        fill: #64748b;
        font-size: 11px;
      }
    </style>
  </defs>

  <rect width="1440" height="900" rx="18" fill="#f5f7fb" />
  <rect
    x="1"
    y="1"
    width="1438"
    height="898"
    rx="17"
    fill="none"
    stroke="#dbe3ef"
  />

  <g class="ui">
    <rect x="0" y="0" width="1440" height="78" rx="18" fill="#ffffff" />
    <rect x="0" y="60" width="1440" height="18" fill="#ffffff" />
    <line x1="0" y1="78" x2="1440" y2="78" stroke="#dbe3ef" />
    <rect x="34" y="24" width="30" height="30" rx="8" fill="#0d6efd" />
    <path d="M42 45h5v-8h5v8h5v-14H42z" fill="#fff" />
    <text x="78" y="35" class="title">Sales Cockpit</text>
    <text x="78" y="56" class="muted">
      Anna Petrova · ADMIN · workspace acme-sales
    </text>
    <rect x="1262" y="22" width="64" height="34" rx="9" fill="#eef4ff" />
    <text x="1278" y="44" class="label" fill="#0d6efd">Refresh</text>
    <text x="1350" y="44" class="label">Sign out</text>

    <g filter="url(#shadow)">
      <rect x="32" y="104" width="326" height="126" rx="12" fill="#ffffff" />
      <rect x="382" y="104" width="326" height="126" rx="12" fill="#ffffff" />
      <rect x="732" y="104" width="326" height="126" rx="12" fill="#ffffff" />
      <rect x="1082" y="104" width="326" height="126" rx="12" fill="#ffffff" />
    </g>

    <text x="54" y="135" class="muted">WEIGHTED FORECAST</text>
    <circle cx="329" cy="132" r="13" fill="#dcfce7" />
    <path
      d="M322 137l5-6 4 3 6-8"
      fill="none"
      stroke="#198754"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <text x="54" y="178" class="metric">₽ 8.4M</text>
    <text x="54" y="205" class="body">Pipeline ₽ 18.7M</text>

    <text x="404" y="135" class="muted">SALES RISKS</text>
    <circle cx="679" cy="132" r="13" fill="#fff7d6" />
    <path d="M679 123l9 17h-18z" fill="#e2a500" />
    <text x="404" y="178" class="metric">12</text>
    <text x="404" y="205" class="body">Overdue, stale and no follow-up</text>

    <text x="754" y="135" class="muted">TASKS</text>
    <circle cx="1029" cy="132" r="13" fill="#e7f0ff" />
    <path
      d="M1023 132l4 4 8-9"
      fill="none"
      stroke="#0d6efd"
      stroke-width="2.5"
      stroke-linecap="round"
    />
