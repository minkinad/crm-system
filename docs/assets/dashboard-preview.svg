    <text x="754" y="205" class="body">Latest team activities</text>

    <text x="1104" y="135" class="muted">ACCOUNTS</text>
    <circle cx="1379" cy="132" r="13" fill="#e5f7ed" />
    <path
      d="M1373 139v-14h12v14m-8-10h2m2 0h2m-6 4h2m2 0h2"
      fill="none"
      stroke="#198754"
      stroke-width="2"
    />
