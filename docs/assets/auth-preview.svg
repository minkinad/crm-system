<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1440"
  height="820"
  viewBox="0 0 1440 820"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">CRM System authentication screen</title>
  <desc id="description">Tenant-aware CRM login form.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow
        dx="0"
        dy="16"
        stdDeviation="28"
        flood-color="#0f172a"
        flood-opacity="0.14"
      />
    </filter>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff" />
      <stop offset="1" stop-color="#f4fbf7" />
    </linearGradient>
    <style>
      .ui {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .title {
        fill: #0f172a;
        font-size: 34px;
        font-weight: 750;
      }
      .body {
        fill: #64748b;
        font-size: 16px;
      }
      .label {
        fill: #475569;
        font-size: 13px;
        font-weight: 600;
      }
      .field {
        fill: #94a3b8;
        font-size: 15px;
      }
    </style>
  </defs>
  <rect width="1440" height="820" rx="18" fill="url(#wash)" />
  <circle cx="176" cy="120" r="220" fill="#0d6efd" opacity="0.055" />
  <circle cx="1290" cy="742" r="285" fill="#198754" opacity="0.055" />
  <g class="ui">
    <g transform="translate(160 238)">
      <rect width="88" height="88" rx="24" fill="#0d6efd" />
      <circle cx="26" cy="26" r="9" fill="#fff" />
      <circle cx="62" cy="26" r="9" fill="#fff" />
      <circle cx="44" cy="57" r="9" fill="#fff" />
      <path
        d="M30 30l10 20m18-20L48 50"
        stroke="#fff"
        stroke-width="5"
        stroke-linecap="round"
      />
    </g>
    <text x="160" y="368" class="title">CRM System</text>
    <text x="160" y="403" class="body">
      Secure multi-tenant sales workspace
    </text>
    <text x="160" y="453" class="body">
      Pipeline visibility, next actions and team activity
    </text>
    <g transform="translate(160 492)">
      <circle cx="10" cy="10" r="10" fill="#dcfce7" />
      <path
        d="M5 10l3 3 7-7"
        fill="none"
        stroke="#198754"
        stroke-width="2"
        stroke-linecap="round"
      />
      <text x="32" y="15" class="label">Server-owned tenant isolation</text>
      <circle cx="10" cy="52" r="10" fill="#dcfce7" />
      <path
        d="M5 52l3 3 7-7"
        fill="none"
        stroke="#198754"
        stroke-width="2"
        stroke-linecap="round"
      />
      <text x="32" y="57" class="label">Rotated HttpOnly refresh sessions</text>
      <circle cx="10" cy="94" r="10" fill="#dcfce7" />
      <path
        d="M5 94l3 3 7-7"
        fill="none"
        stroke="#198754"
        stroke-width="2"
        stroke-linecap="round"
      />
      <text x="32" y="99" class="label">RBAC, CSRF and audit trail</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="824" y="106" width="456" height="608" rx="18" fill="#ffffff" />
    </g>
    <text x="872" y="172" class="title">CRM Login</text>
    <text x="872" y="204" class="body">
      Enter your workspace and credentials.
    </text>

    <text x="872" y="252" class="label">TENANT SLUG</text>
    <rect
      x="872"
      y="266"
      width="360"
      height="58"
      rx="9"
      fill="#fff"
      stroke="#cbd5e1"
    />
    <text x="892" y="301" class="field">acme-sales</text>

    <text x="872" y="365" class="label">EMAIL</text>
    <rect
      x="872"
      y="379"
      width="360"
      height="58"
      rx="9"
      fill="#fff"
      stroke="#cbd5e1"
    />
    <text x="892" y="414" class="field">anna@acme.example</text>

    <text x="872" y="478" class="label">PASSWORD</text>
    <rect
      x="872"
      y="492"
      width="360"
      height="58"
      rx="9"
      fill="#fff"
      stroke="#cbd5e1"
    />
    <text x="892" y="527" class="field">••••••••••••</text>

    <rect x="872" y="584" width="360" height="58" rx="9" fill="#0d6efd" />
    <text x="1032" y="620" fill="#fff" font-size="16" font-weight="700">
      Sign in
    </text>
    <text x="872" y="678" class="body">No account?</text>
    <text x="973" y="678" fill="#0d6efd" font-size="16" font-weight="650">
      Create a workspace
    </text>
  </g>
</svg>
